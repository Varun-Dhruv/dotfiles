# ============================================================
# TMUX CONFIG
# ============================================================

# ------------------------------------------------------------
# General
# ------------------------------------------------------------

# Start window/pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Enable mouse
set -g mouse on

# Increase scrollback history
set -g history-limit 100000

# Start with zsh
set -g default-shell /usr/bin/zsh

# 24-bit true color
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Faster escape-key response
set -sg escape-time 10

# Focus events
set -g focus-events on


# ------------------------------------------------------------
# Prefix
# ------------------------------------------------------------

# Keep the standard Ctrl+B prefix
unbind C-b
set -g prefix C-b
bind C-b send-prefix


# ------------------------------------------------------------
# Pane management
# ------------------------------------------------------------

# Split panes using | and -
unbind %
unbind '"'

bind | split-window -h
bind - split-window -v

# Preserve current working directory
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"


# ------------------------------------------------------------
# Pane navigation
# ------------------------------------------------------------

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Also allow Alt + arrow keys
bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R


# ------------------------------------------------------------
# Pane resizing
# ------------------------------------------------------------

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5


# ------------------------------------------------------------
# Window navigation
# ------------------------------------------------------------

bind -n M-h previous-window
bind -n M-l next-window

# Alt + number to jump to window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5


# ------------------------------------------------------------
# Reload config
# ------------------------------------------------------------

bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"


# ------------------------------------------------------------
# Copy mode
# ------------------------------------------------------------

setw -g mode-keys vi

# Vi-style copy
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# ------------------------------------------------------------
# Status bar
# ------------------------------------------------------------

set -g status-position bottom
set -g status-interval 5

set -g status-left-length 30
set -g status-right-length 100

set -g status-left " #S "
set -g status-right " #{username} | %Y-%m-%d %H:%M "

setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "

# Status bar appearance
set -g status-style "bg=default,fg=white"
setw -g window-status-style "fg=colour245"
setw -g window-status-current-style "fg=white,bold"

# Pane borders
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour75"

# Messages
set -g message-style "fg=white,bold"


# ------------------------------------------------------------
# Catppuccin theme
# ------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'arcticicestudio/nord-tmux'


# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'
